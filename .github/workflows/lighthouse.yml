# Accessibility-only Lighthouse CI against the local SvelteKit build.
# Does not hit production. Does not publish a site-wide score.
# Does not replace vision/site/ACCESSIBILITY.md (VoiceOver) or the HTTP route checker.

name: Lighthouse accessibility

on:
  push:
    branches: [main]
    paths:
      - "vision/site/**"
      - ".github/workflows/lighthouse.yml"
      - ".github/scripts/serve-static-clean.py"
      - "lighthouserc.json"
  pull_request:
    branches: [main]
    paths:
      - "vision/site/**"
      - ".github/workflows/lighthouse.yml"
      - ".github/scripts/serve-static-clean.py"
      - "lighthouserc.json"

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Named Observatory routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vision/site/package-lock.json

      - name: Install dependencies
        working-directory: vision/site
        run: npm ci

      - name: Build
        working-directory: vision/site
        run: npm run build

      - name: Add GitHub Pages directory index for footer-audit
        run: |
          test -f vision/site/build/footer-audit.html
          mkdir -p vision/site/build/footer-audit
          cp vision/site/build/footer-audit.html vision/site/build/footer-audit/index.html

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
