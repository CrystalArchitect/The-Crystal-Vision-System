# Bot registry — hub design skeleton (Canon: no)
# Living runtimes live in satellite repos. Secrets never go in this file.
# publish_mode: human_only is the default for every row until Crystal stamps otherwise.
# Stages 1–6 are pools, not rows. Research children are fork-mirrors under BOT-RESEARCH.

