name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  python-checks:
    name: Python syntax + self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check Python sources
        run: python -m compileall -q core vision src

      # vision/site/src/content/ is a copy of the umbrella's mythos/content/.
      # Copies drift: two documents diverged and nine were never copied at
      # all before anyone noticed. This asserts the copy still matches the
      # canon commit recorded in .canon-source -- a pinned commit, not the
      # umbrella's moving main, so that a change over there cannot turn this
      # repository red without this repository changing.
      - name: Canon mirror is faithful
        run: python3 .github/scripts/check-canon-mirror.py
      - name: CrystalBus self-test
        working-directory: core/crystal-core
        run: python -m bus.selftest
      - name: Pipeline self-test
        working-directory: core/crystal-core
        run: python -m services.selftest
      - name: Install Starline dependencies
        working-directory: core/crystal-core
        run: pip install -r requirements-consenttransport.txt
      - name: Starline self-test
        working-directory: core/crystal-core
        run: python -m consent_transport.selftest
      - name: RDP self-test
        working-directory: core/crystal-core
        run: python -m rdp.selftest
      - name: Host trust self-test
        working-directory: core/crystal-core
        run: python -m host_trust.selftest
      - name: Receipts self-test
        working-directory: core/crystal-core
        run: python -m receipts.selftest
      - name: Install CrystalBridge dependencies
        working-directory: core/crystalcore
        run: pip install -r requirements-bridge.txt
      - name: CrystalBridge self-test
        working-directory: core
        run: python -m crystalcore.selftest
      - name: Mesh stub tests
        working-directory: core
        env:
          PYTHONPATH: .
        run: |
          pip install pytest
          python -m pytest tests -q
      # The companion's own tests went with it to
      # CrystalArchitect/Clementine-ai-companion, where they run in that
      # repository's CI — 99 of them, against the copy that actually ships.
      # Running a second, older copy here was the drift this consolidation
      # removed.
      - name: Discord bot tests
        run: pip install -r vision/apps/clementine-discord/requirements-discord.txt pytest
      - name: Discord bot
        run: python -m pytest vision/apps/clementine-discord/tests -q
