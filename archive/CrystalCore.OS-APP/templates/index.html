<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CrystalCore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050308;
    --bg-glow: #170b26;
    --panel: rgba(255, 255, 255, 0.04);
    --border: rgba(167, 139, 250, 0.22);
    --text: #e9e7f0;
    --dim: #9b94ae;
    --crystal: #a78bfa;
    --crystal-deep: #cfd4e0;
    --user-bubble: linear-gradient(135deg, #6d28d9, #9333ea);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse 80% 50% at 50% -10%, var(--bg-glow), var(--bg));
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  .title h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    background: linear-gradient(90deg, var(--crystal), var(--crystal-deep));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .title p {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 0.75rem;
    color: var(--dim);
    margin-top: 1px;
    letter-spacing: 0.03em;
  }
  .controls { display: flex; align-items: center; gap: 8px; }
  select, .ghost-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 14px;
    padding: 7px 10px;
    font-size: 0.8rem;
    outline: none;
    cursor: pointer;
  }
  select:focus { border-color: var(--crystal); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 18px;
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: rise 0.25s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 6px;
  }
  .assistant {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
    box-shadow: 0 0 24px rgba(167, 139, 250, 0.07);
  }
  .error {
    align-self: center;
    background: rgba(248, 113, 113, 0.12);
    border: 1px solid rgba(248, 113, 113, 0.35);
    color: #fca5a5;
    font-size: 0.85rem;
  }
  .typing { color: var(--dim); font-style: italic; }
  .typing::after {
    content: "";
    display: inline-block;
    width: 1em;
    animation: dots 1.2s steps(4) infinite;
    overflow: hidden;
    vertical-align: bottom;
  }
  @keyframes dots { to { width: 2em; } }

  form {
    display: flex;
    gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  #input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 22px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
    outline: none;
  }
  #input:focus { border-color: var(--crystal); box-shadow: 0 0 12px rgba(167, 139, 250, 0.25); }
  #send {
    padding: 0 20px;
    border: none;
    border-radius: 22px;
    background: linear-gradient(135deg, #6d28d9, var(--crystal));
    color: #f2f0f7;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <div class="title">
      <h1>CRYSTALCORE</h1>
      <p>the lattice remembers</p>
    </div>
    <div class="controls">
      <select id="provider" title="Which AI powers CrystalCore"></select>
      <button id="newchat" class="ghost-btn" type="button" title="Start a fresh conversation (memories are kept)">New</button>
    </div>
  </header>

  <div id="chat"></div>

  <form id="form">
    <input id="input" type="text" placeholder="Speak to CrystalCore…" autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const providerSelect = document.getElementById("provider");
  const newChatBtn = document.getElementById("newchat");

  const GREETING = "The lattice glows — steady, clear. I'm here. What shall we begin with?";

  function addMsg(role, text, extraClass) {
    const div = document.createElement("div");
    div.className = "msg " + role + (extraClass ? " " + extraClass : "");
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function loadState() {
    try {
      const res = await fetch("/api/state");
      const data = await res.json();

      providerSelect.innerHTML = "";
      for (const p of data.providers) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.label + (p.configured ? "" : " (no key)");
        providerSelect.appendChild(opt);
      }
      providerSelect.value = data.default_provider;

      chat.innerHTML = "";
      if (data.history.length === 0) {
        addMsg("assistant", GREETING);
      } else {
        for (const m of data.history) {
          addMsg(m.role === "user" ? "user" : "assistant", m.content);
        }
      }
    } catch (err) {
      addMsg("error", "Could not load the conversation: " + err.message);
    }
  }

  newChatBtn.addEventListener("click", async () => {
    if (!confirm("Start a fresh conversation? Long-term memories are kept.")) return;
    await fetch("/api/new_chat", { method: "POST" });
    chat.innerHTML = "";
    addMsg("assistant", GREETING);
    input.focus();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    send.disabled = true;
    addMsg("user", text);

    const typing = addMsg("assistant", "CrystalCore is resonating", "typing");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, provider: providerSelect.value }),
      });
      const data = await res.json();
      typing.remove();

      if (!res.ok) {
        addMsg("error", data.error || "Something went wrong.");
      } else {
        addMsg("assistant", data.reply);
      }
    } catch (err) {
      typing.remove();
      addMsg("error", "Connection lost: " + err.message);
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  loadState();
</script>
</body>
</html>
