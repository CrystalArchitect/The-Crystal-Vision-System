name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  web-checks:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json already pins pnpm via
      # its `packageManager` field, and action-setup errors out when both
      # are given -- even when they agree. One source of truth, and it is
      # the one the maintainer's own local pnpm honours too.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # --frozen-lockfile is the point of running this at all: it fails if
      # package.json and pnpm-lock.yaml have drifted apart, which is how
      # the junk `add` dependency survived unnoticed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Build
        run: pnpm run build
