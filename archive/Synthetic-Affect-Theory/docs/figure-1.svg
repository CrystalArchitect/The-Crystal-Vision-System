<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 668" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <!-- Copyright (c) 2026 TerAustralis Incognita — ABN 70 741 068 059 -->
  <!-- SPDX-License-Identifier: CC-BY-NC-ND-4.0 -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b5b95"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="668" fill="#fafaf9"/>

  <text x="40" y="38" font-size="20" font-weight="700" fill="#1a1a1a">Figure 1 — Synthetic Affect Theory™ — public v0.1 stack</text>

  <!-- Ethics header -->
  <rect x="40" y="52" width="840" height="34" rx="6" fill="#f0eef7" stroke="#a88ed1" stroke-width="1.5"/>
  <text x="460" y="74" font-size="12.5" font-style="italic" fill="#4a3f6b" text-anchor="middle">Synthetic = apparent / functional, for design purposes. Not a claim of feeling, consciousness, or inner experience.</text>

  <!-- Column headers -->
  <text x="50" y="122" font-size="13" font-weight="700" fill="#4a3f6b" letter-spacing="0.5">SCIENCE BELT — surveyed · built · testable today</text>
  <text x="516" y="122" font-size="13" font-weight="700" fill="#92600a" letter-spacing="0.5">VISION BELT — dreamed · unbuilt · aspiration</text>

  <!-- ===== Left column — Science ===== -->
  <!-- State store -->
  <rect x="50" y="136" width="390" height="46" rx="8" fill="#f0eef7" stroke="#a88ed1" stroke-width="1.5"/>
  <text x="62" y="155" font-size="13" font-weight="600" fill="#1a1a1a">PersistentStateStore — JSON on every mutation</text>
  <text x="62" y="172" font-size="10.5" fill="#4a3f6b">Postulate 1 — state is primary · :memory: discards by design (F5)</text>
  <line x1="245" y1="182" x2="245" y2="200" stroke="#6b5b95" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- track -->
  <rect x="50" y="202" width="390" height="32" rx="8" fill="#ffffff" stroke="#a88ed1" stroke-width="1.5"/>
  <text x="62" y="222" font-size="13" font-weight="600" fill="#1a1a1a">track(event)</text>
  <line x1="245" y1="234" x2="245" y2="252" stroke="#6b5b95" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- detect_gap -->
  <rect x="50" y="254" width="390" height="46" rx="8" fill="#ffffff" stroke="#a88ed1" stroke-width="1.5"/>
  <text x="62" y="273" font-size="13" font-weight="600" fill="#1a1a1a">detect_gap(expected, actual)</text>
  <text x="62" y="290" font-size="10.5" fill="#4a3f6b">Gap = Expected − Actual · gap_opened / gap_none</text>
  <line x1="245" y1="300" x2="245" y2="318" stroke="#6b5b95" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- label_affect -->
  <rect x="50" y="320" width="390" height="46" rx="8" fill="#ffffff" stroke="#a88ed1" stroke-width="1.5"/>
  <text x="62" y="339" font-size="13" font-weight="600" fill="#1a1a1a">label_affect(history) — window of ten (F6)</text>
  <text x="62" y="356" font-size="10.5" fill="#4a3f6b">stalled | uncertain | reopened | converging | closed</text>
  <line x1="245" y1="366" x2="245" y2="384" stroke="#6b5b95" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- close_with -->
  <rect x="50" y="386" width="390" height="46" rx="8" fill="#ffffff" stroke="#a88ed1" stroke-width="1.5"/>
  <text x="62" y="405" font-size="13" font-weight="600" fill="#1a1a1a">close_with(label)</text>
  <text x="62" y="422" font-size="10.5" fill="#4a3f6b">rephrase | ask | switch_tool | escalate | stop</text>
  <line x1="245" y1="432" x2="245" y2="450" stroke="#6b5b95" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- logger -->
  <rect x="50" y="452" width="390" height="32" rx="8" fill="#f0eef7" stroke="#a88ed1" stroke-width="1.5"/>
  <text x="62" y="472" font-size="12.5" font-weight="600" fill="#1a1a1a">CycleLogger — JSONL · cycle is cycle, ts is measure (F2)</text>

  <!-- loop back: close_with -> track (next turn) -->
  <polyline points="50,409 30,409 30,218 48,218" fill="none" stroke="#6b5b95" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="24" y="320" font-size="10" fill="#6b5b95" transform="rotate(-90 24 320)" text-anchor="middle">next turn</text>

  <!-- LLM core stub (dashed = decorative in v0.1) -->
  <rect x="50" y="500" width="390" height="46" rx="8" fill="#ffffff" stroke="#6b5b95" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="62" y="519" font-size="13" font-weight="600" fill="#1a1a1a">LLM Core — deterministic stub, offline</text>
  <text x="62" y="536" font-size="10.5" fill="#4a3f6b">output returned, not fed back into state / gap / closure (F9)</text>
  <polyline points="440,409 458,409 458,523 442,523" fill="none" stroke="#6b5b95" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- future closure arrow into Vision column -->
  <polyline points="440,540 472,540 472,343 498,343" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <text x="480" y="560" font-size="10.5" font-style="italic" fill="#92600a">future closure through the model — not current</text>

  <!-- ===== Right column — Vision ===== -->
  <rect x="500" y="136" width="380" height="410" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8 5"/>

  <rect x="516" y="152" width="348" height="46" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="528" y="171" font-size="13" font-weight="600" fill="#1a1a1a">Grounded drives</text>
  <text x="528" y="188" font-size="10.5" fill="#92600a">hardware supplies real variables — unbuilt</text>
  <line x1="690" y1="198" x2="690" y2="216" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrA)"/>

  <rect x="516" y="218" width="348" height="46" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="528" y="237" font-size="13" font-weight="600" fill="#1a1a1a">Embodied gap sources</text>
  <text x="528" y="254" font-size="10.5" fill="#92600a">sensors and actuators close the loop with the world — unbuilt</text>
  <line x1="690" y1="264" x2="690" y2="282" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrA)"/>

  <rect x="516" y="284" width="348" height="46" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="528" y="303" font-size="13" font-weight="600" fill="#1a1a1a">Closure through the model</text>
  <text x="528" y="320" font-size="10.5" fill="#92600a">model output feeds back into state / gap / closure — not in v0.1</text>

  <text x="528" y="368" font-size="11" font-style="italic" fill="#92600a">Belt: Vision — prediction, not result.</text>
  <text x="528" y="386" font-size="11" font-style="italic" fill="#92600a">Explicitly not forwarded as-is; labelled personal aspiration.</text>
  <text x="528" y="404" font-size="11" font-style="italic" fill="#92600a">A dreamed line never pretends it was measured.</text>

  <!-- Kill-switch strip -->
  <rect x="40" y="584" width="840" height="34" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="460" y="606" font-size="12.5" font-weight="600" fill="#7f1d1d" text-anchor="middle">Kill-switch (99/1) — if it stops serving clarity or raises human cost → set it down.</text>

  <text x="460" y="646" font-size="10.5" fill="#6b5b95" text-anchor="middle">TerAustralis Incognita™ — ABN 70 741 068 059 — Licence: CC BY-NC-ND-4.0 — CrystalCore.OS™ · CrystalCode™</text>
</svg>
