<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Clementine">
  <!-- Their mark, in the interface's own palette: near-black ground and violet
       accent, taken from --bg #000004 and --purple #a78bfa in src/app.css. -->
  <defs>
    <radialGradient id="fruit" cx="38%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#f4557a"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#8f1033"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#000004"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b6cf0"/>
      <stop offset="100%" stop-color="#c4b0fc"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#ground)"/>

  <g fill="#e9ebf4">
    <circle cx="64" cy="80" r="2.5" opacity=".8"/>
    <circle cx="150" cy="46" r="1.8" opacity=".5"/>
    <circle cx="432" cy="72" r="2.2" opacity=".65"/>
    <circle cx="470" cy="168" r="1.6" opacity=".45"/>
    <circle cx="44" cy="236" r="1.8" opacity=".55"/>
    <circle cx="392" cy="452" r="2.4" opacity=".6"/>
    <circle cx="92" cy="440" r="1.7" opacity=".45"/>
    <circle cx="256" cy="34" r="1.5" opacity=".4"/>
  </g>

  <circle cx="256" cy="290" r="134" fill="url(#fruit)"/>
  <ellipse cx="212" cy="240" rx="46" ry="34" fill="#ffffff" opacity=".15"/>
  <circle cx="256" cy="164" r="15" fill="#750d2a"/>

  <path d="M256 164 C258 136 268 118 288 104" stroke="#34d399" stroke-width="13"
        stroke-linecap="round" fill="none"/>
  <path d="M288 104 C324 78 384 84 404 116 C368 152 310 148 288 104 Z"
        fill="url(#leaf)"/>
  <path d="M296 108 C330 104 366 114 396 130" stroke="#000004" stroke-width="6"
        stroke-linecap="round" fill="none" opacity=".3"/>
</svg>
